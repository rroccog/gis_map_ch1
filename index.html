<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mapa</title>
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
  <style>
    html, body { margin: 0; height: 100%; }
    #map { position: absolute; inset: 0; }
    .maplibregl-popup-content { font: 13px/1.5 system-ui, sans-serif; }
  </style>
</head>
<body>
  <div id="map"></div>

  <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
  <script>
    // URL de tu API en Render (sin "/" al final)
    //const API_BASE = "http://127.0.0.1:5000";
    const API_BASE = "https://gis-app-ch1.onrender.com"

    // Capa por defecto; se cambia con index.html?capa=nombre
    const CAPA_POR_DEFECTO = "Uso_Actual";
    const CAPA = new URLSearchParams(location.search).get("capa") || CAPA_POR_DEFECTO;

    // Propiedad que se muestra al pasar el mouse (si la capa no la tiene, no sale nada)
    const CAMPO_ETIQUETA = "Uso_actual";

    const COLOR = "#2563eb";
    const CAPAS_INTERACTIVAS = ["relleno", "lineas", "puntos"];

    const esc = v => String(v).replace(/[&<>"']/g, c =>
      ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

    // Recorre las coordenadas de cualquier geometría para calcular los límites
    function extender(coords, b) {
      if (typeof coords[0] === "number") b.extend(coords);
      else coords.forEach(c => extender(c, b));
    }

    const map = new maplibregl.Map({
      container: "map",
      center: [-72.59, -38.74],
      zoom: 9,
      style: {
        version: 8,
        sources: {
          osm: {
            type: "raster",
            tiles: ["https://tile.openstreetmap.org/{z}/{x}/{y}.png"],
            tileSize: 256,
            attribution: "© OpenStreetMap"
          }
        },
        layers: [{ id: "osm", type: "raster", source: "osm" }]
      }
    });
    map.addControl(new maplibregl.NavigationControl());

    let hoverId = null;
    function setHover(id) {
      if (hoverId !== null) map.setFeatureState({ source: "capa", id: hoverId }, { hover: false });
      hoverId = id;
      if (id !== null) map.setFeatureState({ source: "capa", id }, { hover: true });
    }

    map.on("load", async () => {
      let datos;
      try {
        const res = await fetch(`${API_BASE}/capas/${encodeURIComponent(CAPA)}`);
        if (res.status === 404) throw new Error(`La capa "${CAPA}" no está disponible en la API`);
        if (!res.ok) throw new Error("La API respondió " + res.status);
        datos = await res.json();
      } catch (e) {
        console.error(e);
        alert("No se pudo cargar la capa: " + e.message);
        return;
      }

      // generateId asigna un id a cada entidad, necesario para el hover
      map.addSource("capa", { type: "geojson", data: datos, generateId: true });

      const hover = ["boolean", ["feature-state", "hover"], false];

      map.addLayer({
        id: "relleno", type: "fill", source: "capa",
        filter: ["==", "$type", "Polygon"],
        paint: { "fill-color": COLOR, "fill-opacity": ["case", hover, 0.65, 0.3] }
      });
      map.addLayer({
        id: "lineas", type: "line", source: "capa",
        filter: ["in", "$type", "Polygon", "LineString"],
        paint: { "line-color": COLOR, "line-width": ["case", hover, 3, 1.5] }
      });
      map.addLayer({
        id: "puntos", type: "circle", source: "capa",
        filter: ["==", "$type", "Point"],
        paint: {
          "circle-radius": ["case", hover, 9, 6],
          "circle-color": "#d62828",
          "circle-stroke-width": 2,
          "circle-stroke-color": "#ffffff"
        }
      });

      // Ajusta el mapa a toda la capa
      const bounds = new maplibregl.LngLatBounds();
      datos.features.forEach(f => extender(f.geometry.coordinates, bounds));
      if (!bounds.isEmpty()) map.fitBounds(bounds, { padding: 60, maxZoom: 16 });

      // Hover: resalta la entidad y muestra la etiqueta
      const tooltip = new maplibregl.Popup({ closeButton: false, closeOnClick: false, offset: 12 });

      map.on("mousemove", e => {
        const f = map.queryRenderedFeatures(e.point, { layers: CAPAS_INTERACTIVAS })[0];
        map.getCanvas().style.cursor = f ? "pointer" : "";
        if (!f) { setHover(null); tooltip.remove(); return; }
        if (f.id !== hoverId) setHover(f.id);
        const etiqueta = CAMPO_ETIQUETA && f.properties[CAMPO_ETIQUETA];
        if (etiqueta) tooltip.setLngLat(e.lngLat).setHTML(`<b>${esc(etiqueta)}</b>`).addTo(map);
        else tooltip.remove();
      });
      map.getCanvas().addEventListener("mouseleave", () => { setHover(null); tooltip.remove(); });

      // Clic: popup con todos los atributos
      map.on("click", e => {
        const f = map.queryRenderedFeatures(e.point, { layers: CAPAS_INTERACTIVAS })[0];
        if (!f) return;
        const filas = Object.entries(f.properties)
          .map(([k, v]) => `<b>${esc(k)}:</b> ${esc(v)}`).join("<br>");
        new maplibregl.Popup().setLngLat(e.lngLat).setHTML(filas).addTo(map);
      });
    });
  </script>
</body>
</html>
